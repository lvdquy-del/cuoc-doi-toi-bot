
services:
  - type: web
    name: cuoc-doi-toi-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: GROUP_ID
        value: ""
      - key: DB_PATH
        value: /tmp/bot.db
      - key: WELCOME_TEXT
        value: "🎉 Chào mừng {name} đến với CUỘC ĐỜI TÔI!"
      - key: SYSTEM_PROMPT
        value: "Bạn là trợ lý thân thiện của nhóm Telegram CUỘC ĐỜI TÔI. Trả lời bằng tiếng Việt, ngắn gọn, lịch sự."
